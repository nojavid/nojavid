<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar - Finix</title>
  <link rel="stylesheet" href="editar.css">
</head>
<body>

  <!-- ============================================
       HEADER PRINCIPAL (vista lista)
       ============================================ -->
  <header class="header" id="headerPrincipal">
    <div class="header-inner">
      <a href="billetera.html" class="btn-regresar" id="btnRegresar" aria-label="Regresar">
        <img src="../iconos/flecharegreso.png" alt="Regresar" class="icono-regresar" onerror="this.src='iconos/flecharegreso.png'">
      </a>

      <h1 class="titulo-editar">Actualizar datos</h1>

      <p class="subtitulo-editar">Administra tus secciones de deudas y metas de ahorro</p>
    </div>
  </header>

  <!-- ============================================
       VISTA LISTA (secciones)
       ============================================ -->
  <main class="contenedor-secciones" id="contenedorSecciones"></main>

  <!-- ============================================
       VISTA DE EDICIÓN INDIVIDUAL (oculta por defecto)
       ============================================ -->
  <section class="vista-edicion" id="vistaEdicion" hidden>

    <header class="header-edicion">
      <div class="header-edicion-inner">
        <button class="btn-regresar-edicion" id="btnRegresarEdicion" aria-label="Regresar">
          <svg class="icono-regresar-svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="arrow-group">
              <path d="M5 12l14 0" />
              <path d="M5 12l4 4" />
              <path d="M5 12l4 -4" />
            </g>
          </svg>
        </button>
        <h1 class="titulo-edicion">Actualizar datos</h1>
      </div>
    </header>

    <!-- Card de contexto (rectángulo con color de la sección) -->
    <div class="card-contexto" id="cardContexto">
      <div class="card-contexto-circulo" id="cardContextoCirculo">
        <img src="" alt="" class="card-contexto-icono" id="cardContextoIcono">
      </div>
      <div class="card-contexto-textos">
        <h2 class="card-contexto-titulo" id="cardContextoTitulo">Deudas</h2>
        <p class="card-contexto-nombre" id="cardContextoNombre">Tarjeta de crédito</p>
      </div>
    </div>

    <!-- Formulario de edición -->
    <form class="form-edicion" id="formEdicion">

      <div class="form-grupo">
        <label class="form-label" for="editNombre">Nombre</label>
        <input type="text" class="form-input" id="editNombre" required>
      </div>

      <div class="form-grupo">
        <label class="form-label" for="editMonto">Monto</label>
        <input type="text" inputmode="numeric" class="form-input" id="editMonto" required>
      </div>

      <div class="form-grupo">
        <label class="form-label" for="editFecha">Fecha</label>
        <input type="date" class="form-input" id="editFecha" required>
      </div>

      <div class="form-grupo">
        <label class="form-label">Recordatorio</label>
        <div class="form-recordatorio">
          <label class="radio-opcion">
            <input type="radio" name="editRecordatorio" value="diario">
            <span class="radio-custom"></span>
            <span class="radio-texto">Diario</span>
          </label>
          <label class="radio-opcion">
            <input type="radio" name="editRecordatorio" value="semanal">
            <span class="radio-custom"></span>
            <span class="radio-texto">Semanal</span>
          </label>
          <label class="radio-opcion">
            <input type="radio" name="editRecordatorio" value="mensual">
            <span class="radio-custom"></span>
            <span class="radio-texto">Mensual</span>
          </label>
        </div>
      </div>

      <div class="form-grupo" id="grupoEditDiaRecordatorio">
        <label class="form-label" for="editDiaRecordatorio">¿Qué día recordar?</label>
        <select class="form-select" id="editDiaRecordatorio"></select>
      </div>

      <button type="submit" class="btn-guardar-cambios" id="btnGuardarCambios">
        Guardar cambios
      </button>

      <button type="button" class="btn-eliminar" id="btnEliminar">
        Eliminar
      </button>

    </form>
  </section>

  <!-- ============================================
       MODAL CONFIRMACIÓN ELIMINAR
       ============================================ -->
  <div class="modal-confirm-overlay" id="modalConfirmOverlay">
    <div class="modal-confirm" id="modalConfirm">
      <h3 class="modal-confirm-titulo">¿Eliminar registro?</h3>
      <p class="modal-confirm-texto">Esta acción es permanente y no se puede deshacer.</p>

      <div class="modal-confirm-botones">
        <button type="button" class="modal-confirm-btn modal-confirm-btn-cancelar" id="btnConfirmCancelar">
          Cancelar
        </button>
        <button type="button" class="modal-confirm-btn modal-confirm-btn-eliminar" id="btnConfirmEliminar">
          Eliminar
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================
       NAVEGACIÓN INFERIOR
       ============================================ -->
  <div class="bottom-nav" id="bottomNav">
    <a href="../finix.html" data-page="finix.html">
      <img src="../iconos/casa.png" alt="casa" onerror="this.src='iconos/casa.png'">
    </a>

    <a href="billetera.html" data-page="billetera.html" class="active" id="navBilletera">
      <div class="nav-activo-rect">
        <img src="../iconos/billetera1.4.png" alt="billetera" class="nav-activo-icono" onerror="this.src='iconos/billetera1.4.png'">
        <span class="nav-activo-texto">Billetera</span>
      </div>
    </a>

    <a href="Reportes/reportes.html" data-page="reportes.html">
      <img src="../iconos/barra.png" alt="reportes" onerror="this.src='iconos/barra.png'">
    </a>
    <a href="../configuracion.html" data-page="configuracion.html">
      <img src="../iconos/tuerca.png" alt="tuerca" onerror="this.src='iconos/tuerca.png'">
    </a>
  </div>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="editar.js"></script>
</body>
</html>
