<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera - Finix</title>
  <link rel="stylesheet" href="billetera.css">
</head>
<body>

  <!-- ============================================
       HEADER
       ============================================ -->
  <header class="header">
    <div class="header-inner">

      <!-- Saludo -->
      <h1 class="saludo">Hola, <span id="nombreUsuario">Name</span></h1>
      <h2 class="subtitulo">Billetera</h2>

      <!-- Interruptor modo oscuro / claro -->
      <div class="interruptor-tema">
        <div class="rectangulo-luna" id="btnModoClaro">
          <img src="../iconos/luna.png" alt="luna" class="icono-luna">
        </div>
        <div class="rectangulo-sol" id="btnModoOscuro">
          <img src="../iconos/solblanco.png" alt="sol" class="icono-sol">
        </div>
      </div>

      <!-- Botón de fecha -->
      <div class="fecha-contenedor" id="btnFecha">
        <img src="../iconos/calendario1.4.png" alt="calendario" class="icono-calendario">
        <p class="fecha">
          <span id="fechaActual">Abril 2026</span>
        </p>
        <span class="flecha">^</span>
      </div>

    </div>
  </header>

  <!-- ============================================
       SECCIÓN TOTAL (Balance) - RESPONSIVE
       ============================================ -->
  <section class="seccion total">
    <img src="../iconos/ondas1.png" alt="" class="ondas-total">

    <div class="circulo-billetera">
      <img src="../iconos/billetera1.4.png" alt="billetera" class="icono-billetera-total">
    </div>

    <h2 class="titulo-balance">Balance total</h2>
    <p class="valor-balance" id="balanceTotal">$3.240.000</p>

    <div class="linea-vertical-total"></div>

    <img src="../iconos/flechaverde.png" alt="ahorro" class="flecha-total flecha-verde-total">
    <h3 class="titulo-ahorro-total">Ahorro</h3>
    <p class="valor-ahorro-total" id="totalAhorro">$0</p>

    <div class="linea-horizontal-total"></div>

    <img src="../iconos/flecharoga.png" alt="deudas" class="flecha-total flecha-roja-total">
    <h3 class="titulo-deudas-total">Deudas</h3>
    <p class="valor-deudas-total" id="totalDeudas">$0</p>
  </section>

  <!-- ============================================
       SECCIÓN DEUDAS (REDISEÑADA)
       ============================================ -->
  <section class="seccion deudas">

    <!-- Recuadro Total Deudas -->
    <div class="total-deudas-box" id="totalDeudasBox">
      Total: $0
    </div>

    <!-- Cabecera -->
    <div class="deudas-header">
      <div class="deudas-circulo">
        <img src="../iconos/tarjeta.png" alt="tarjeta" class="deudas-icono">
      </div>
      <h2 class="deudas-titulo">Deudas</h2>
    </div>

    <p class="deudas-descripcion">En lo que debes y en que va cada una</p>

    <!-- Lista de deudas -->
    <div class="deudas-lista" id="deudasLista">

      <!-- Item de ejemplo -->
      <div class="deuda-item">
        <div class="deuda-item-header">
          <div class="deuda-item-circulo">
            <img src="../iconos/tarjeta.png" alt="tarjeta" class="deuda-item-icono">
          </div>
          <h4 class="deuda-item-nombre">Nombre de la deuda</h4>
        </div>
        <p class="deuda-item-fecha">Vence 28 Sep</p>
        <div class="deuda-progreso-container">
          <div class="deuda-progreso-barra">
            <div class="deuda-progreso-relleno" style="width: 50%;"></div>
          </div>
          <span class="deuda-progreso-texto">50%</span>
        </div>
      </div>

    </div>
  </section>

  <!-- ============================================
       SECCIÓN METAS DE AHORRO (REDISEÑADA)
       ============================================ -->
  <section class="seccion metas">

    <!-- Recuadro Total Metas -->
    <div class="total-metas-box" id="totalMetasBox">
      Total: $0
    </div>

    <!-- Cabecera -->
    <div class="metas-header">
      <div class="metas-circulo">
        <img src="../iconos/Meta.png" alt="meta" class="metas-icono">
      </div>
      <h2 class="metas-titulo">Metas de Ahorro</h2>
    </div>

    <p class="metas-descripcion">Tus planes a futuro</p>

    <!-- Lista de metas -->
    <div class="metas-lista" id="metasLista">

      <!-- Item de ejemplo -->
      <div class="meta-item">
        <div class="meta-item-header">
          <div class="meta-item-circulo">
            <img src="../iconos/Meta.png" alt="meta" class="meta-item-icono">
          </div>
          <h4 class="meta-item-nombre">Nombre del plan</h4>
        </div>
        <p class="meta-item-fecha">Vence 29 Sep</p>
        <div class="meta-progreso-container">
          <div class="meta-progreso-barra">
            <div class="meta-progreso-relleno" style="width: 50%;"></div>
          </div>
          <span class="meta-progreso-texto">50%</span>
        </div>
      </div>

    </div>
  </section>

  <!-- ============================================
       BOTÓN AGREGAR (imagen mas.png) - encima del menú
       ============================================ -->
  <button class="btn-agregar-mas" id="btnAgregar" aria-label="Agregar">
    <img src="../iconos/mas.png" alt="Agregar" class="icono-mas">
  </button>

  <!-- ============================================
       NAVEGACIÓN INFERIOR
       ============================================ -->
  <div class="bottom-nav">
    <a href="../finix.html" data-page="finix.html">
      <img src="../iconos/casa.png" alt="casa" onerror="this.src='iconos/casa.png'">
    </a>

    <!-- Botón activo: Billetera -->
    <a href="billetera.html" data-page="billetera.html" class="active">
      <div class="nav-activo-rect">
        <img src="../iconos/billetera1.4.png" alt="billetera" class="nav-activo-icono" onerror="this.src='iconos/billetera1.4.png'">
        <span class="nav-activo-texto">Billetera</span>
      </div>
    </a>

    <a href="../reportes.html" data-page="reportes.html">
      <img src="../iconos/barra.png" alt="reportes" onerror="this.src='iconos/barra.png'">
    </a>
    <a href="../configuracion.html" data-page="configuracion.html">
      <img src="../iconos/tuerca.png" alt="tuerca" onerror="this.src='iconos/tuerca.png'">
    </a>
  </div>

  <script src="billetera.js"></script>
</body>
</html>
