<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crear cuenta - Finix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="registro.css">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="register-screen" id="registerScreen">

    <!-- Logo -->
    <div class="reg-header">
      <img src="iconos/Logofinanzas.png" alt="Finix" class="reg-logo">
    </div>

    <!-- Títulos -->
    <div class="reg-titles">
      <h1 class="reg-title">Crea una cuenta</h1>
      <p class="reg-sub">Empieza a organizar tus</p>
      <p class="reg-sub">finanzas y construye tus metas.</p>
    </div>

    <!-- Formulario -->
    <form class="reg-form" id="registerForm" autocomplete="off" novalidate>

      <!-- Nombre completo -->
      <div class="reg-group">
        <label class="reg-label" for="fullname">Nombre completo</label>
        <div class="reg-field" id="fieldFullname">
          <span class="reg-icon" id="iconFullname">
            <svg viewBox="0 0 24 24" fill="none" class="icon-default">
              <circle cx="12" cy="8" r="4" stroke="#D9D9D9" stroke-width="2"/>
              <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke="#D9D9D9" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" class="icon-valid">
              <circle cx="12" cy="8" r="4" stroke="#39FF14" stroke-width="2"/>
              <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke="#39FF14" stroke-width="2" stroke-linecap="round"/>
              <path d="M15.5 11.5l2 2 4-4" stroke="#39FF14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input type="text" id="fullname" name="fullname" placeholder="Ej. Juan Pérez" required>
        </div>
      </div>

      <!-- Correo -->
      <div class="reg-group">
        <label class="reg-label" for="email">Correo electrónico</label>
        <div class="reg-field" id="fieldEmail">
          <span class="reg-icon" id="iconEmail">
            <svg viewBox="0 0 24 24" fill="none" class="icon-default">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="#D9D9D9" stroke-width="2"/>
              <path d="M2 7l10 7 10-7" stroke="#D9D9D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" class="icon-valid">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="#39FF14" stroke-width="2"/>
              <path d="M2 7l10 7 10-7" stroke="#39FF14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="reg-group">
        <label class="reg-label" for="password">Contraseña</label>
        <div class="reg-field" id="fieldPassword">
          <span class="reg-icon" id="iconPassword">
            <svg viewBox="0 0 24 24" fill="none" class="icon-default">
              <path d="M12 2l8 4v5c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V6l8-4z" stroke="#D9D9D9" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9 12l2 2 4-4" stroke="#D9D9D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" class="icon-valid">
              <circle cx="12" cy="12" r="9" stroke="#39FF14" stroke-width="2"/>
              <path d="M8 12l3 3 5-6" stroke="#39FF14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>

          <button type="button" class="reg-toggle" data-target="password" aria-label="Mostrar contraseña">
            <svg class="toggle-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g class="eye-parts">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </g>
              <path class="eye-strike" d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Repetir contraseña -->
      <div class="reg-group">
        <label class="reg-label" for="password2">Repite tu contraseña</label>
        <div class="reg-field" id="fieldPassword2">
          <span class="reg-icon" id="iconPassword2">
            <svg viewBox="0 0 24 24" fill="none" class="icon-default">
              <path d="M12 2l8 4v5c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V6l8-4z" stroke="#D9D9D9" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" class="icon-valid">
              <circle cx="12" cy="12" r="9" stroke="#39FF14" stroke-width="2"/>
              <path d="M8 12l3 3 5-6" stroke="#39FF14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input type="password" id="password2" name="password2" placeholder="Repite la contraseña" required>

          <button type="button" class="reg-toggle" data-target="password2" aria-label="Mostrar contraseña">
            <svg class="toggle-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g class="eye-parts">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </g>
              <path class="eye-strike" d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Botón Crear cuenta -->
      <button type="submit" class="reg-submit" id="btnSubmit">
        <span>Crear cuenta</span>
        <svg viewBox="0 0 24 24" fill="none" class="reg-arrow">
          <path d="M9 6l6 6-6 6" stroke="#FFFFFF" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </form>

    <!-- Separador O -->
    <div class="reg-separator">
      <span class="sep-line"></span>
      <span class="sep-text">O</span>
      <span class="sep-line"></span>
    </div>

    <!-- Accesos rápidos -->
    <div class="quick-access">
      <button class="qa-btn" type="button" id="googleRegistroBtn" aria-label="Google">
        <svg viewBox="0 0 48 48" width="24" height="24">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C41 35.9 44 30.4 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
      </button>
      <button class="qa-btn" type="button" aria-label="Apple">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="#000" d="M16.4 12.9c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.9-1.5-.1-2.8.9-3.5.9s-1.9-.8-3.1-.8c-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.1 1.7 2.4 3 2.4 1.2 0 1.7-.8 3.1-.8s1.8.8 3.1.8c1.3 0 2.1-1.1 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.7-1.1-2.7-3.9zM14.1 5.7c.6-.8 1.1-1.9 1-3-.9 0-2 .6-2.7 1.4-.6.7-1.2 1.9-1 3 1 .1 2-.6 2.7-1.4z"/>
        </svg>
      </button>
      <button class="qa-btn" type="button" aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="#1877F2" d="M22 12a10 10 0 10-11.6 9.9v-7H8v-2.9h2.4V9.8c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.5.7-1.5 1.5v1.8h2.6L15 14.9h-2.1v7A10 10 0 0022 12z"/>
        </svg>
      </button>
    </div>

    <!-- ¿Ya tienes cuenta? -->
    <div class="reg-footer">
      <p class="reg-have-account">¿Ya tienes cuenta?</p>
      <a href="Login.html" class="reg-login-link" id="btnGoLogin">Iniciar Sección</a>
    </div>

  </div>

  <script src="../comunicacion.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (typeof eventos !== 'undefined') {
          eventos.usuarioEntro('Finix - Registro');
          window.addEventListener('beforeunload', function() {
            if (typeof eventos !== 'undefined') eventos.usuarioSalio('Finix - Registro');
          });
        }
      }, 100);
    });
  </script>

  <!-- ============================================
       GOOGLE SIGN-IN (Registro)
       ============================================ -->
  <script>
    (function () {
      const CLIENT_ID = "368673555834-1rmhim6cr22quun34e3gfq52a1ofiroq.apps.googleusercontent.com";

      window.handleGoogleRegistro = function (response) {
        try {
          const payload = JSON.parse(atob(response.credential.split('.')[1]));
          console.log("✅ Google user (registro):", payload);

          // Guardar como nuevo usuario (igual formato que tu registro normal)
          localStorage.setItem("finix_new_user", JSON.stringify({
            nombre: payload.name,
            email: payload.email,
            picture: payload.picture,
            provider: "google",
            createdAt: new Date().toISOString()
          }));

          // También guardar la sesión activa
          localStorage.setItem("finix_user", JSON.stringify({
            email: payload.email,
            name: payload.name,
            picture: payload.picture,
            provider: "google",
            remember: true,
            loginAt: new Date().toISOString()
          }));

          // Animación de salida y redirección a Login
          const registerScreen = document.getElementById("registerScreen");
          registerScreen.style.transition = "opacity 0.4s ease, transform 0.4s ease";
          registerScreen.style.opacity = "0";
          registerScreen.style.transform = "translateX(40px)";

          setTimeout(function () {
            window.location.href = "Login.html";
          }, 420);

        } catch (err) {
          console.error("❌ Error con Google (registro):", err);
          alert("Hubo un error al registrarte con Google.");
        }
      };

      window.addEventListener("load", function () {
        if (typeof google === "undefined" || !google.accounts) {
          console.warn("⚠️ Google Identity Services no cargó");
          return;
        }

        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: window.handleGoogleRegistro,
          auto_select: false,
          cancel_on_tap_outside: true
        });

        const btn = document.getElementById("googleRegistroBtn");
        if (btn) {
          btn.addEventListener("click", function () {
            google.accounts.id.prompt();
          });
        }
      });
    })();
  </script>

  <script src="registro.js"></script>
</body>
</html>
