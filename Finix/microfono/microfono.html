<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cámara - Finix</title>
  <link rel="stylesheet" href="microfono.css" />
</head>
<body>

  <!-- Botón salir -->
  <button id="btnSalir" class="btn-salir" aria-label="Salir">✕</button>

  <!-- Texto principal -->
  <div id="textoPrincipal" class="texto-principal">
    Cuéntame todos los detalles de tu transacción.
  </div>

  <!-- Lista de gastos detectados -->
  <div id="listaGastos" class="lista-gastos oculto"></div>

  <!-- Animación IA -->
  <div id="analizando" class="analizando oculto">
    <div class="ia-spinner">
      <div class="ia-ring"></div>
      <div class="ia-core">🤖</div>
    </div>
    <p class="ia-texto">
      Procesando tus gastos
      <span class="puntos"><span>.</span><span>.</span><span>.</span></span>
    </p>
  </div>

  <!-- Acciones -->
  <div id="acciones" class="acciones oculto">
    <button id="btnAgregarMas" class="btn-accion btn-secundario">+ Agregar más</button>
    <button id="btnGuardar" class="btn-accion btn-primario">Guardar datos</button>
  </div>

  <!-- Micrófono -->
  <div id="btnMicrofono" class="circulo-microfono">
    <img src="../iconos/microfonoblanco.png" alt="Grabar" class="icono-microfono" />
  </div>

  <!-- Modal de edición -->
  <div id="modalEdicion" class="modal oculto">
    <div class="modal-contenido">
      <h3>Editar movimiento</h3>
      <label>Icono
        <input id="editIcono" type="text" maxlength="4" />
      </label>
      <label>Nombre
        <input id="editNombre" type="text" maxlength="40" />
      </label>
      <label>Valor (COP)
        <input id="editValor" type="number" min="0" step="1" />
      </label>
      <div class="modal-botones">
        <button id="modalCancelar" class="btn-accion btn-secundario">Cancelar</button>
        <button id="modalGuardar" class="btn-accion btn-primario">Guardar</button>
      </div>
    </div>
  </div>

  <audio id="audioReproductor" class="oculto"></audio>

  <script src="microfono.js"></script>
</body>
</html>
