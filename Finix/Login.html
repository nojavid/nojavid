<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tu Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- ============================================
       PANTALLA 1: BIENVENIDA
       ============================================ -->
  <div class="screen" id="screen">

    <!-- 1. Ondas ARRIBA IZQUIERDA (volteadas horizontalmente) -->
    <img 
      src="iconos/Ondasazules.png" 
      alt="" 
      class="ondas-top" 
      id="ondasTop"
    >

    <!-- 2. Logo CENTRAL -->
    <img 
      src="iconos/Logofinanzas.png" 
      alt="Logo Finanzas" 
      class="logo" 
      id="logo"
    >

    <!-- 3. Título -->
    <h1 class="titulo" id="titulo">Tu Finanzas</h1>

    <!-- 4. Subtítulo -->
    <p class="subtitulo" id="subtitulo">Hoy mejor que ayer</p>

    <!-- 5. Línea dorada -->
    <div class="linea" id="linea"></div>

    <!-- 6. Descripción -->
    <p class="descripcion" id="descripcion">
      Organiza tus deudas,<br>
      controla tus gastos y alcanza<br>
      tus metas de ahorro
    </p>

    <!-- 7. Ondas ABAJO DERECHA (volteadas verticalmente) -->
    <img 
      src="iconos/Ondasazules.png" 
      alt="" 
      class="ondas-bottom" 
      id="ondasBottom"
    >

    <!-- Pista visual: "Desliza para continuar" -->
    <div class="hint" id="hint">
      <span class="hint-text">Toca o desliza para continuar</span>
      <span class="hint-arrow">›</span>
    </div>

  </div>

  <!-- ============================================
       PANTALLA 2: LOGIN (oculta al inicio)
       ============================================ -->
  <div class="screen login-screen" id="loginScreen">

    <!-- Ondas decorativas del login -->
    <img 
      src="iconos/Ondasazules.png" 
      alt="" 
      class="ondas-top" 
    >
    <img 
      src="iconos/Ondasazules.png" 
      alt="" 
      class="ondas-bottom" 
    >

    <!-- Logo arriba -->
    <img 
      src="iconos/Logofinanzas.png" 
      alt="Logo Finanzas" 
      class="login-logo"
    >

    <!-- Título login -->
    <h2 class="login-titulo">Iniciar sesión</h2>
    <p class="login-subtitulo">Bienvenido de nuevo</p>

    <!-- Formulario -->
    <form class="login-form" id="loginForm" autocomplete="off">

      <!-- Campo correo -->
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="tucorreo@ejemplo.com" 
          required
        >
      </div>

      <!-- Campo contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <!-- Botón -->
      <button type="submit" class="btn-login">Entrar</button>

      <!-- Link secundario -->
      <p class="login-footer">
        ¿No tienes cuenta? <a href="#">Regístrate</a>
      </p>

    </form>

    <!-- Botón atrás -->
    <button class="btn-back" id="btnBack" type="button">←</button>

  </div>

  <script src="login.js"></script>
</body>
</html>
